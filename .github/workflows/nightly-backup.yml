name: Nightly pg_dump backup

on:
  schedule:
    # 22:00 AEST (UTC+10) — before staging RDS stops at 00:00 Melbourne.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [staging, prod]
    env:
      BACKUP_ENV: ${{ matrix.env }}
      BACKUP_S3_BUCKET: startline-${{ matrix.env }}-backups
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2
          role-session-name: gha-nightly-backup

      - name: Start staging RDS if stopped
        if: matrix.env == 'staging'
        shell: bash
        run: |
          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier startline-staging-postgres \
            --query 'DBInstances[0].DBInstanceStatus' --output text)
          if [ "$STATUS" = "stopped" ]; then
            echo "Starting staging RDS..."
            aws rds start-db-instance --db-instance-identifier startline-staging-postgres
            aws rds wait db-instance-available --db-instance-identifier startline-staging-postgres
          else
            echo "Staging RDS status: $STATUS — no start needed"
          fi

      - name: Install postgresql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Dump and upload
        shell: bash
        run: |
          DATABASE_URL="$(aws secretsmanager get-secret-value \
            --secret-id "startline/${{ matrix.env }}/app" \
            --query SecretString --output text | jq -r '.DATABASE_URL')"
          echo "::add-mask::$DATABASE_URL"
          ./scripts/backup-db.sh
